<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Shinpoko 写真・動画エディタ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-view="home" data-mode="photo">

<!-- ホーム -->
<section id="home">
  <div class="home-head">
    <h1>Shinpoko</h1>
    <p>写真も動画も、いまっぽく加工</p>
  </div>
  <div class="cards">
    <button class="card c-photo" data-start="photo">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>
      <b>写真を編集</b><span>ライブラリから選ぶ</span>
    </button>
    <button class="card c-camera" data-start="camera">
      <svg viewBox="0 0 24 24"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.6"/></svg>
      <b>カメラで撮る</b><span>エフェクトをかけて撮影・録画</span>
    </button>
    <button class="card c-video" data-start="video">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="13" height="14" rx="3"/><path d="M16 10l5-3v10l-5-3z"/></svg>
      <b>動画を編集</b><span>エフェクトを重ねて書き出し</span>
    </button>
  </div>
  <p class="home-foot">写真・動画は端末の中だけで処理され、外部には送信されません。</p>
</section>

<!-- 編集 -->
<div id="edit">
  <header class="topbar">
    <button class="icon" id="closeBtn" aria-label="閉じる"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button class="icon" id="undoBtn" aria-label="ひとつ戻す" disabled><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a6 6 0 0 1 0 12" transform="translate(0 -4)"/></svg></button>
    <div class="title" id="title">写真</div>
    <button class="done" id="doneBtn">保存</button>
  </header>

  <main id="stage">
    <canvas id="out"></canvas>
    <div id="empty">
      <p id="emptyText">写真を選んでください</p>
      <button class="big" id="emptyBtn">写真を選ぶ</button>
    </div>
    <div id="toast"></div>
  </main>

  <!-- カメラ/動画の操作 -->
  <section id="media">
    <div class="mbar" data-for="camera">
      <button class="icon" id="flipCam" aria-label="カメラ切替"><svg viewBox="0 0 24 24"><path d="M20 8V5h-3M4 16v3h3"/><path d="M19.5 5A9 9 0 0 0 4.6 8M4.5 19A9 9 0 0 0 19.4 16"/></svg></button>
      <button class="shutter" id="shutter" aria-label="撮影"></button>
      <button class="rec" id="recBtn">● 録画</button>
    </div>
    <div class="mbar" data-for="video">
      <button class="icon" id="playBtn" aria-label="再生/一時停止">⏸</button>
      <input type="range" id="seek" min="0" max="1000" value="0">
      <button class="icon" id="muteBtn" aria-label="ミュート">🔊</button>
    </div>
    <div id="progress"><i></i></div>
  </section>

  <section id="panel">
    <!-- 選択ストリップ -->
    <div id="strip">
      <div class="pane on" id="pane-filter"><div class="thumbs" id="filterChips"></div></div>

      <div class="pane" id="pane-face">
        <div class="thumbs" id="arChips"></div>
        <label class="slider">小顔 <input type="range" id="beautySlim" min="0" max="100" value="0"><output>0</output></label>
        <label class="slider">目を大きく <input type="range" id="beautyEyes" min="0" max="100" value="0"><output>0</output></label>
        <p class="hint">顔が正面〜やや斜めに写っていると、耳やひげがぴったり追従します(最大3人)。</p>
      </div>

      <div class="pane" id="pane-effect">
        <div class="thumbs" id="effectChips"></div>
        <label class="slider">強さ <input type="range" id="effectAmt" min="0" max="150" value="100"><output id="effectAmtV">100</output></label>
      </div>

      <div class="pane" id="pane-adjust">
        <label class="slider">明るさ <input type="range" data-adj="brightness" min="-100" max="100" value="0"><output>0</output></label>
        <label class="slider">コントラスト <input type="range" data-adj="contrast" min="-100" max="100" value="0"><output>0</output></label>
        <label class="slider">あざやかさ <input type="range" data-adj="saturation" min="-100" max="100" value="0"><output>0</output></label>
        <label class="slider">暖かさ <input type="range" data-adj="warmth" min="-100" max="100" value="0"><output>0</output></label>
        <label class="slider">シャープ <input type="range" data-adj="sharpness" min="0" max="100" value="0"><output>0</output></label>
        <label class="slider">ビネット <input type="range" data-adj="vignette" min="0" max="100" value="0"><output>0</output></label>
        <div class="row"><button id="adjReset">リセット</button></div>
      </div>

      <div class="pane" id="pane-mosaic">
        <div class="seg" id="mosaicShape"><button data-v="brush" class="on">なぞる</button><button data-v="rect">四角</button></div>
        <div class="seg" id="mosaicStyle"><button data-v="pixel" class="on">モザイク</button><button data-v="blur">ぼかし</button></div>
        <div class="seg" id="mosaicMode"><button data-v="paint" class="on">かける</button><button data-v="erase">消す</button></div>
        <label class="slider">粗さ <input type="range" id="mosaicBlock" min="6" max="60" value="20"><output>20</output></label>
        <label class="slider">ブラシ <input type="range" id="mosaicBrush" min="10" max="150" value="50"><output>50</output></label>
        <div class="row">
          <button id="mosaicAll">全体にかける</button>
          <button id="mosaicClear">ぜんぶ消す</button>
        </div>
        <p class="hint">画面をなぞると、そこにモザイクがかかります。</p>
      </div>

      <div class="pane" id="pane-draw">
        <div class="seg" id="drawTool">
          <button data-v="pen" class="on">ペン</button>
          <button data-v="stamp">スタンプ</button>
          <button data-v="text">文字</button>
          <button data-v="eraser">消しゴム</button>
        </div>
        <div class="chips sub" data-for="pen" id="penTypes"></div>
        <div class="chips sub" data-for="stamp" id="stamps"></div>
        <div class="sub" data-for="text">
          <input type="text" id="textInput" placeholder="入れたい文字" value="すき♡" maxlength="30">
          <div class="chips" id="textStyles"></div>
        </div>
        <div class="swatches" id="colors"></div>
        <label class="slider">サイズ <input type="range" id="penSize" min="4" max="60" value="14"><output>14</output></label>
        <div class="row"><button id="drawClear">ぜんぶ消す</button></div>
      </div>

      <div class="pane" id="pane-template"><div class="thumbs" id="templateGrid"></div></div>
    </div>

    <!-- 下部タブバー -->
    <nav id="tools">
      <button data-tool="filter" class="on"><svg viewBox="0 0 24 24"><circle cx="9" cy="9" r="5"/><circle cx="15" cy="9" r="5"/><circle cx="12" cy="15" r="5"/></svg><span>フィルター</span></button>
      <button data-tool="face"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M5.5 9L5 3l5 3M18.5 9L19 3l-5 3"/><circle cx="9" cy="12.5" r="1" class="f"/><circle cx="15" cy="12.5" r="1" class="f"/><path d="M10 16.2q2 1.6 4 0"/></svg><span>顔AR</span></button>
      <button data-tool="effect"><svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8z"/></svg><span>エフェクト</span></button>
      <button data-tool="adjust"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2" class="f"/><circle cx="15" cy="12" r="2" class="f"/><circle cx="8" cy="17" r="2" class="f"/></svg><span>調整</span></button>
      <button data-tool="mosaic"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 9.3h16M4 14.7h16M9.3 4v16M14.7 4v16"/></svg><span>モザイク</span></button>
      <button data-tool="draw"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14 7l3 3"/></svg><span>書き込み</span></button>
      <button data-tool="template"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3"/><rect x="7.5" y="7.5" width="9" height="9" rx="1.5"/></svg><span>フレーム</span></button>
    </nav>
  </section>
</div>

<div id="result" hidden>
  <div class="sheet">
    <video id="resultVideo" controls playsinline loop></video>
    <div class="row">
      <button id="resultSave" class="done">保存</button>
      <button id="resultClose">閉じる</button>
    </div>
  </div>
</div>

<!-- ソース(画面外で再生) -->
<video id="camVideo" playsinline muted autoplay class="hiddenmedia"></video>
<video id="fileVideo" playsinline loop class="hiddenmedia"></video>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="videoInput" accept="video/*" hidden>

<script src="vendor/glfx.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14121a">
<title>Shinpoko 写真・動画エディタ</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <h1>Shinpoko</h1>
  <nav id="modes">
    <button data-mode="photo" class="on">写真</button>
    <button data-mode="camera">カメラ</button>
    <button data-mode="video">動画</button>
  </nav>
</header>

<main id="stage">
  <canvas id="out"></canvas>
  <div id="empty">
    <p id="emptyText">写真を選んで編集をはじめよう</p>
    <button class="big" id="emptyBtn">写真を選ぶ</button>
  </div>
  <div id="toast"></div>
</main>

<section id="bars">
  <div class="bar" data-for="photo">
    <button id="openPhoto">写真を選ぶ</button>
    <button id="savePhoto" class="primary">保存</button>
  </div>
  <div class="bar" data-for="camera">
    <button id="flipCam">🔄 切替</button>
    <button id="shutter" class="shutter" aria-label="撮影"></button>
    <button id="recBtn" class="rec">● 録画</button>
  </div>
  <div class="bar" data-for="video">
    <button id="openVideo">動画を選ぶ</button>
    <button id="playBtn">⏸</button>
    <button id="muteBtn">🔊</button>
    <button id="exportBtn" class="primary">書き出し</button>
  </div>
  <div id="progress"><i></i></div>
</section>

<section id="panel">
  <div class="tabs" id="tools">
    <button data-tool="filter" class="on">加工</button>
    <button data-tool="mosaic">モザイク</button>
    <button data-tool="draw">書き込み</button>
    <button data-tool="template">テンプレート</button>
  </div>

  <div class="pane on" id="pane-filter">
    <div class="chips" id="filterChips"></div>
    <label class="slider">明るさ <input type="range" id="adjBrightness" min="-100" max="100" value="0"></label>
    <label class="slider">コントラスト <input type="range" id="adjContrast" min="-100" max="100" value="0"></label>
    <label class="slider">あざやかさ <input type="range" id="adjSaturation" min="-100" max="100" value="0"></label>
  </div>

  <div class="pane" id="pane-mosaic">
    <div class="seg" id="mosaicShape"><button data-v="brush" class="on">なぞる</button><button data-v="rect">四角</button></div>
    <div class="seg" id="mosaicStyle"><button data-v="pixel" class="on">モザイク</button><button data-v="blur">ぼかし</button></div>
    <div class="seg" id="mosaicMode"><button data-v="paint" class="on">かける</button><button data-v="erase">消す</button></div>
    <label class="slider">粗さ <input type="range" id="mosaicBlock" min="6" max="60" value="20"></label>
    <label class="slider">ブラシ <input type="range" id="mosaicBrush" min="10" max="150" value="50"></label>
    <div class="row">
      <button id="mosaicAll">全体にかける</button>
      <button id="mosaicClear">ぜんぶ消す</button>
    </div>
    <p class="hint">画面をなぞると、そこにモザイクがかかります。</p>
  </div>

  <div class="pane" id="pane-draw">
    <div class="seg" id="drawTool">
      <button data-v="pen" class="on">ペン</button>
      <button data-v="stamp">スタンプ</button>
      <button data-v="text">文字</button>
      <button data-v="eraser">消しゴム</button>
    </div>
    <div class="chips sub" data-for="pen" id="penTypes"></div>
    <div class="chips sub" data-for="stamp" id="stamps"></div>
    <div class="sub" data-for="text">
      <input type="text" id="textInput" placeholder="入れたい文字" value="すき♡" maxlength="30">
      <div class="chips" id="textStyles"></div>
    </div>
    <div class="swatches" id="colors"></div>
    <label class="slider">サイズ <input type="range" id="penSize" min="4" max="60" value="14"></label>
    <div class="row">
      <button id="drawUndo">↶ ひとつ戻す</button>
      <button id="drawClear">ぜんぶ消す</button>
    </div>
  </div>

  <div class="pane" id="pane-template">
    <div class="grid" id="templateGrid"></div>
  </div>
</section>

<div id="result" hidden>
  <div class="card">
    <video id="resultVideo" controls playsinline loop></video>
    <div class="row">
      <button id="resultSave" class="primary">保存</button>
      <button id="resultClose">閉じる</button>
    </div>
  </div>
</div>

<!-- 画像・動画ソース(画面外で再生) -->
<video id="camVideo" playsinline muted autoplay class="hiddenmedia"></video>
<video id="fileVideo" playsinline loop class="hiddenmedia"></video>
<input type="file" id="photoInput" accept="image/*" hidden>
<input type="file" id="videoInput" accept="video/*" hidden>

<script src="vendor/glfx.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
